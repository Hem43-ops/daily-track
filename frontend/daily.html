<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Routine — DailyTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/daily.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <header class="site-header">
    <div class="container nav-inner">
      <a href="dashboard.html" class="brand">DailyTrack</a>

      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="primaryNav">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

      <nav class="primary-nav" id="primaryNav">
        <ul>
          <li><a href="dashboard.html">Home</a></li>
          <li><a href="daily.html" class="active">Daily Routine</a></li>
          <li><a href="health.html">Health</a></li>
          <li><a href="diary.html">Diary</a></li>
          <li><a href="timetable.html">Time Table</a></li>
          <li><a href="progress.html">Progress</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-ghost">Log out</a>
      </div>
    </div>
  </header>

  <main class="routine-page">
    <div class="container">

      <div class="routine-header">
        <div>
          <h1>Today's Routine</h1>
          <p class="routine-date" id="routineDate">—</p>
        </div>
      </div>

      <div class="routine-summary">
        <span class="ring-value" id="routinePercent">0%</span>
        <div class="progress-track">
          <div class="progress-fill" id="routineProgressFill" style="width: 0%;"></div>
        </div>
        <span class="routine-summary-count" id="routineCount">0 of 0 done</span>
      </div>

      <form class="add-task-form" id="addTaskForm">
        <div class="form-field">
          <label for="taskTime">Time</label>
          <input type="time" id="taskTime" required />
        </div>
        <div class="form-field">
          <label for="taskLabel">Task</label>
          <input type="text" id="taskLabel" placeholder="e.g. Study" required />
        </div>
        <div class="form-field">
          <label for="taskCategory">Category</label>
          <select id="taskCategory">
            <option value="routine">Routine</option>
            <option value="health">Health</option>
            <option value="productivity">Productivity</option>
            <option value="other">Other</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Add task</button>
      </form>

      <ul class="task-card-list" id="taskCardList">
        <!-- populated by daily.js -->
      </ul>

    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/daily.js"></script>
</body>
</html>
